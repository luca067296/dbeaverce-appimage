name: Build DBeaver AppImage Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: archlinux:latest 

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git wget xorg-server-xvfb patchelf zsync awk

      - name: Build DBeaver AppImage
        run: |
          #!/bin/bash
          set -e

          mkdir -p dbeaver-src/usr/bin
          
          wget -qO dbeaver.tar.gz "https://dbeaver.io/files/dbeaver-ce-latest-linux.gtk.x86_64.tar.gz"
          tar -xzf dbeaver.tar.gz -C dbeaver-src/usr/bin
          rm dbeaver.tar.gz

          cat << 'EOF' > dbeaver-src/usr/bin/dbeaver-launcher
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/dbeaver"
          exec -a "$HERE/dbeaver/dbeaver" "$HERE/dbeaver/dbeaver" -install "$HERE/dbeaver" -vm "$HERE/dbeaver/jre/bin/java" "$@"
          EOF
          chmod +x dbeaver-src/usr/bin/dbeaver-launcher

          mkdir -p dbeaver-src/usr/share/applications dbeaver-src/usr/share/icons/hicolor/48x48/apps
          cp dbeaver-src/usr/bin/dbeaver/icon.xpm dbeaver-src/usr/share/icons/hicolor/48x48/apps/dbeaver.xpm

          cat << EOF > dbeaver-src/usr/share/applications/dbeaver.desktop
          [Desktop Entry]
          Type=Application
          Name=DBeaver Community
          Exec=dbeaver-launcher
          Icon=dbeaver
          Terminal=false
          Categories=Development;Database;
          EOF

          git clone https://github.com/pkgforge-dev/anylinux-appimages.git
          chmod +x ./anylinux-appimages/useful-tools/quick-sharun.sh
          chmod +x ./anylinux-appimages/useful-tools/get-debloated-pkgs.sh

          ./anylinux-appimages/useful-tools/get-debloated-pkgs.sh --add-common --prefer-nano

          export ICON="$(pwd)/dbeaver-src/usr/share/icons/hicolor/48x48/apps/dbeaver.xpm"
          export DESKTOP="$(pwd)/dbeaver-src/usr/share/applications/dbeaver.desktop"
          export OUTPATH="$(pwd)"
          export OUTNAME="DBeaver-x86_64.AppImage"

          ./anylinux-appimages/useful-tools/quick-sharun.sh dbeaver-src/usr/bin/dbeaver-launcher

          cp -r dbeaver-src/usr/bin/dbeaver AppDir/bin/

          ./anylinux-appimages/useful-tools/quick-sharun.sh --make-appimage

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "DBeaver Continuous Build"
          files: "*.AppImage"
          prerelease: true
